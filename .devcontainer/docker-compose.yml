services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    platform: linux/amd64
    volumes:
     - ..:/workspace:cached



    command: sleep infinity
    networks:
     default:

    ports:
      - "7072:7071"
      - "10001:10000"
      - "10002:10001"
      - "10003:10002"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    ports:
     ports:
     - "10000:10000"
     - "10001:10001"
     - "10002:10002"

