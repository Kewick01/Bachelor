services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    platform: linux/amd64
    volumes:
     - ..:/workspace:cached



    command: python app.py
    networks:
     default:

    ports:
      - "7072:7071"
      - "10001:10001"
      - "10002:10002"
      - "10003:10003"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10010:10010"
      - "10002:10002"

