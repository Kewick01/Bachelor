services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
     .:/workspaces:cached
    command: sleep infinity
    networks:
     default:

    ports:
      - "7071:7071"
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
